<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">光标回航 PointerPilot 海报</title>
  <desc id="desc">一张介绍 macOS 多屏光标回航工具 PointerPilot 的产品海报</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.46" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#E7EEF7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#DCEBFF" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#475569" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 654 C260 590 446 642 670 600 C940 548 1130 420 1600 468 L1600 900 L0 900 Z" fill="#E1ECF8" opacity="0.82"/>
  <path d="M0 740 C268 682 502 724 760 676 C1038 624 1252 548 1600 592 L1600 900 L0 900 Z" fill="#D4E4F6" opacity="0.68"/>

  <g opacity="0.42" stroke="#B7C8DA" stroke-width="1">
    <path d="M120 140 H1480"/>
    <path d="M120 260 H1480"/>
    <path d="M120 380 H1480"/>
    <path d="M120 500 H1480"/>
    <path d="M120 620 H1480"/>
    <path d="M220 70 V720"/>
    <path d="M420 70 V720"/>
    <path d="M620 70 V720"/>
    <path d="M820 70 V720"/>
    <path d="M1020 70 V720"/>
    <path d="M1220 70 V720"/>
    <path d="M1420 70 V720"/>
  </g>

  <g transform="translate(104,98)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800" fill="#2563EB">PointerPilot for macOS</text>
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="88" font-weight="850" fill="url(#ink)">光标回航</text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="650" fill="#334155">一键让光标归位。</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500" fill="#64748B">多屏工作时，按一下侧键，光标立刻回航到下一块屏幕中央。</text>

    <g transform="translate(0,304)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <rect x="0" y="0" width="218" height="58" rx="29" fill="url(#accent)"/>
      <text x="109" y="37" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">鼠标侧键</text>
      <rect x="236" y="0" width="224" height="58" rx="29" fill="#FFFFFF" opacity="0.82" stroke="#C7D2FE"/>
      <text x="348" y="37" text-anchor="middle" font-size="22" font-weight="750" fill="#1E293B">双击 Option</text>
      <rect x="478" y="0" width="230" height="58" rx="29" fill="#FFFFFF" opacity="0.82" stroke="#C7D2FE"/>
      <text x="593" y="37" text-anchor="middle" font-size="22" font-weight="750" fill="#1E293B">键盘快捷键</text>
    </g>

    <g transform="translate(0,438)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="0" y="0" font-size="28" font-weight="800" fill="#0F172A">为多屏工作领航</text>
      <text x="0" y="54" font-size="24" fill="#475569">外接显示器、竖屏、Sidecar、投屏窗口之间来回切换</text>
      <text x="0" y="98" font-size="24" fill="#475569">光标不见时，不再晃鼠标，不再打断思路</text>
      <text x="0" y="142" font-size="24" fill="#475569">菜单栏常驻，安静运行，只做一件事</text>
    </g>
  </g>

  <g transform="translate(934,132)" filter="url(#shadow)">
    <rect x="0" y="0" width="520" height="520" rx="92" fill="url(#glass)" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="28" y="28" width="464" height="464" rx="76" fill="none" stroke="#C7D2FE" stroke-width="2"/>

    <g transform="translate(260,260)">
      <circle r="176" fill="#FFFFFF" opacity="0.28"/>
      <circle r="154" fill="none" stroke="#CBD5E1" stroke-width="2"/>
      <circle r="112" fill="none" stroke="#2563EB" stroke-width="4" opacity="0.68"/>
      <circle r="64" fill="none" stroke="#38BDF8" stroke-width="5" opacity="0.86"/>
      <path d="M0 -178 L14 -136 L0 -148 L-14 -136 Z" fill="#2563EB"/>
      <path d="M178 0 L136 14 L148 0 L136 -14 Z" fill="#2563EB" opacity="0.45"/>
      <path d="M0 178 L14 136 L0 148 L-14 136 Z" fill="#2563EB" opacity="0.45"/>
      <path d="M-178 0 L-136 14 L-148 0 L-136 -14 Z" fill="#2563EB" opacity="0.45"/>
      <text x="0" y="-132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="800" fill="#1E40AF">N</text>
    </g>

    <g transform="translate(102,322)">
      <rect x="0" y="0" width="132" height="82" rx="18" fill="#FFFFFF" stroke="#93A4B8" stroke-width="2"/>
      <rect x="38" y="88" width="56" height="8" rx="4" fill="#93A4B8"/>
      <path d="M82 -44 C182 -84 256 -54 322 -116" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 20"/>
      <circle cx="322" cy="-116" r="15" fill="#2563EB" filter="url(#softGlow)"/>
      <rect x="296" y="-220" width="132" height="82" rx="18" fill="#FFFFFF" stroke="#93A4B8" stroke-width="2"/>
      <rect x="334" y="-132" width="56" height="8" rx="4" fill="#93A4B8"/>
    </g>

    <g transform="translate(250,238)" filter="url(#softGlow)">
      <path d="M0 -58 L0 72" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 72 L40 34 L78 120 C84 133 99 138 111 131 L134 118 C146 111 150 95 142 83 L94 0 L164 0 C181 0 188 -22 174 -32 L20 -134 C9 -142 -8 -134 -8 -120 L-8 -58 Z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(934,730)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="260" y="0" text-anchor="middle" font-size="30" font-weight="850" fill="#0F172A">PointerPilot</text>
    <text x="260" y="46" text-anchor="middle" font-size="23" fill="#64748B">你的多屏光标领航员</text>
  </g>
</svg>
