<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">旋转跳跃我闭着眼海报</title>
  <desc id="desc">一张介绍 macOS 多屏光标切换工具的海报</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FB"/>
      <stop offset="0.44" stop-color="#EAF1F9"/>
      <stop offset="1" stop-color="#DDEBFA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#DCE8F6" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B8CF"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#64748B" flood-opacity="0.20"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="150" r="220" fill="#BFDBFE" opacity="0.45"/>
  <circle cx="250" cy="740" r="270" fill="#FBCFE8" opacity="0.36"/>
  <circle cx="940" cy="760" r="160" fill="#A7F3D0" opacity="0.20"/>

  <g transform="translate(104,96)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#2563EB">macOS 多屏光标定位器</text>
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="78" font-weight="800" fill="#0F172A">旋转跳跃我闭着眼</text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="500" fill="#475569">按一下侧键，光标立刻出现在另一块屏幕中央。</text>
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="500" fill="#475569">不再晃鼠标，不再打断思路。</text>

    <g transform="translate(0,270)">
      <rect x="0" y="0" width="245" height="62" rx="31" fill="url(#blue)"/>
      <text x="122" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">鼠标侧键触发</text>
      <rect x="270" y="0" width="260" height="62" rx="31" fill="#FFFFFF" opacity="0.78" stroke="#CBD5E1"/>
      <text x="400" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#1E293B">双击 Option 备用</text>
      <rect x="555" y="0" width="225" height="62" rx="31" fill="#FFFFFF" opacity="0.78" stroke="#CBD5E1"/>
      <text x="667" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#1E293B">菜单栏常驻</text>
    </g>

    <g transform="translate(0,422)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#0F172A">适合这些时刻</text>
      <text x="0" y="54" font-size="25" fill="#475569">- 外接显示器、竖屏、iPad Sidecar 来回切换</text>
      <text x="0" y="100" font-size="25" fill="#475569">- 全屏窗口之间移动，光标突然不见</text>
      <text x="0" y="146" font-size="25" fill="#475569">- 演示、会议、剪辑、写代码时不想中断节奏</text>
    </g>
  </g>

  <g transform="translate(930,170)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="500" rx="120" fill="url(#panel)" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="18" y="18" width="464" height="464" rx="105" fill="none" stroke="url(#soft)" stroke-width="5" opacity="0.78"/>
    <circle cx="250" cy="250" r="174" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.86"/>
    <circle cx="250" cy="250" r="118" fill="none" stroke="#2563EB" stroke-width="8" opacity="0.70"/>
    <circle cx="250" cy="250" r="78" fill="none" stroke="#93C5FD" stroke-width="6" opacity="0.84"/>
    <g filter="url(#glow)">
      <path d="M236 176 L236 332" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
      <path d="M236 332 L286 286 L333 392 C339 405 354 410 366 403 L389 390 C401 383 405 367 397 355 L339 258 L422 258 C439 258 446 236 432 226 L255 100 C244 92 228 100 228 114 L228 176 Z" fill="#FFFFFF" stroke="#1E40AF" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g stroke="#2563EB" stroke-width="13" stroke-linecap="round" opacity="0.75">
      <line x1="250" y1="114" x2="250" y2="78"/>
      <line x1="205" y1="130" x2="179" y2="104"/>
      <line x1="186" y1="178" x2="150" y2="178"/>
      <line x1="295" y1="130" x2="321" y2="104"/>
      <line x1="314" y1="178" x2="350" y2="178"/>
    </g>
  </g>

  <g transform="translate(930,720)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="250" y="0" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">把“找光标”缩短成一次点击</text>
    <text x="250" y="46" text-anchor="middle" font-size="22" fill="#64748B">轻量、安静、只做一件事</text>
  </g>
</svg>
